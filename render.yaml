# Blueprint do Render com dois serviços gratuitos:
# - niky-api: API Express + SQLite (pasta api/), dorme sem acesso e tem disco temporário;
# - niky: front-end CRA como site estático, apontando para a API por REACT_APP_API_URL.
# Se o Render der outro endereço para a API, ajuste REACT_APP_API_URL no painel e faça um novo deploy do front.
services:
  - type: web
    name: niky-api
    runtime: node
    plan: free
    branch: main
    rootDir: api
    autoDeployTrigger: commit
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
  - type: web
    name: niky
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: REACT_APP_API_URL
        value: https://niky-api.onrender.com
# fim de render.yaml
