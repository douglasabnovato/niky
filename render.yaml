# Blueprint do Render com dois serviços gratuitos:
# - niky-api: API Express + SQLite (pasta api/), dorme sem acesso e tem disco temporário;
# - niky: front-end Vite como site estático, apontando para a API por VITE_API_URL.
# Em 16/11/2026, niky-api.onrender.com responde com outro servidor (gunicorn): o Render deve dar outro endereço à API.
# Nesse caso, ajuste VITE_API_URL no painel e faça um novo deploy do front (docs/DEPLOY.md, passo 3.5).
services:
  - type: web
    name: niky-api
    runtime: node
    plan: free
    branch: main
    rootDir: api
    autoDeployTrigger: commit
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
  - type: web
    name: niky
    runtime: static
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        value: https://niky-api.onrender.com
# fim de render.yaml
